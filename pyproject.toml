[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "untangle-app"
version = "2.0.0"
description = "Untangle: a 100% local, privacy-first companion for working through hard decisions, inner conflicts and difficult conversations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.10.0",
    "fastembed>=0.2.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/Edward-Eughene-Timothy/untangle"

[project.optional-dependencies]
cli = ["prompt_toolkit>=3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.black]
line-length = 100
